<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
<title id="title">Progressive local answer and Exa web enrichment</title><desc id="desc">A browser first asks Qwen for web intent and ontology sources, then runs local Qwen generation and Exa search in parallel before a second Qwen synthesis streams a cited web addendum.</desc>
<defs><style>.bg{fill:#0d0f1b}.panel{fill:#121528;stroke:#343754;stroke-width:2}.q{fill:#201a35;stroke:#b690ff;stroke-width:2}.w{fill:#18182c;stroke:#ff9bd6;stroke-width:2}.s{fill:#171d30;stroke:#9fffd2;stroke-width:2}.e{fill:#241f25;stroke:#f1c75b;stroke-width:2}.ttl{fill:#f7f4ff;font:700 30px system-ui}.sub{fill:#aba8c8;font:18px system-ui}.h{fill:#f7f4ff;font:700 18px system-ui}.p{fill:#cfcbe5;font:15px system-ui}.mono{fill:#9fffd2;font:700 14px ui-monospace,monospace}.wire{fill:none;stroke:#7380a8;stroke-width:3;marker-end:url(#a)}.dash{fill:none;stroke:#f1c75b;stroke-width:3;stroke-dasharray:8 8;marker-end:url(#y)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#7380a8"/></marker><marker id="y" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#f1c75b"/></marker></defs>
<rect class="bg" width="1400" height="850" rx="28"/><text class="ttl" x="55" y="62">nishad.ai — progressive web enrichment</text><text class="sub" x="55" y="95">Local evidence streams first. Public search happens in parallel. A cited addendum arrives later.</text>
<rect class="panel" x="45" y="135" width="1310" height="630" rx="24"/>
<rect class="s" x="80" y="210" width="220" height="180" rx="18"/><text class="mono" x="110" y="248">BROWSER</text><text class="h" x="110" y="290">User question</text><text class="p" x="110" y="330">current context</text><text class="p" x="110" y="360">tab conversation</text>
<path class="wire" d="M300 300H385"/>
<rect class="q" x="385" y="180" width="245" height="220" rx="18"/><text class="mono" x="415" y="218">QWEN · SLOT 0</text><text class="h" x="415" y="260">Ontology → web intent</text><text class="p" x="415" y="302">source + passage routing</text><text class="p" x="415" y="332">distilled evidence context</text><text class="p" x="415" y="362">web search query</text>
<path class="wire" d="M630 285H720"/><path class="dash" d="M505 400V500H720"/>
<rect class="q" x="720" y="175" width="260" height="210" rx="18"/><text class="mono" x="750" y="213">QWEN · SLOT 1</text><text class="h" x="750" y="255">Local answer</text><text class="p" x="750" y="300">ontology + site evidence</text><text class="p" x="750" y="335">stream immediately</text>
<rect class="w" x="720" y="470" width="260" height="180" rx="18"/><text class="mono" x="750" y="508">CLOUDFLARE WORKER</text><text class="h" x="750" y="550">Exa Lite search</text><text class="p" x="750" y="590">≤5 sanitized results</text><text class="p" x="750" y="620">runs in parallel</text>
<path class="wire" d="M980 280H1070"/><path class="wire" d="M980 560H1070"/>
<rect class="e" x="1070" y="315" width="245" height="250" rx="18"/><text class="mono" x="1100" y="353">QWEN · SLOT 1</text><text class="h" x="1100" y="395">Web synthesis</text><text class="p" x="1100" y="437">local answer</text><text class="p" x="1100" y="467">public evidence</text><text class="p" x="1100" y="497">cited addendum</text><text class="p" x="1100" y="527">stream after local</text>
<text class="mono" x="80" y="720">PERCEIVED FLOW: LOCAL ANSWER → “LOADING ESTIMATES/DATA FROM WEB…” → CITED WEB ADDENDUM</text>
</svg>
