<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
<title id="title">Single-slot eviction versus two-slot KV caching</title><desc id="desc">The old single slot alternates routing and answer prompts, evicting each cache. The new architecture dedicates slot zero to routing and slot one to final answers while retaining one active generation.</desc>
<defs><style>.bg{fill:#0d0f1b}.panel{fill:#121528;stroke:#343754;stroke-width:2}.old{fill:#241f25;stroke:#ff6b78;stroke-width:2}.route{fill:#241f25;stroke:#f1c75b;stroke-width:2}.answer{fill:#201a35;stroke:#b690ff;stroke-width:2}.ttl{fill:#f7f4ff;font:700 30px system-ui}.sub{fill:#aba8c8;font:18px system-ui}.h{fill:#f7f4ff;font:700 19px system-ui}.p{fill:#cfcbe5;font:16px system-ui}.mono{fill:#9fffd2;font:700 14px ui-monospace,monospace}.wire{fill:none;stroke:#7380a8;stroke-width:3;marker-end:url(#a)}.bad{fill:none;stroke:#ff6b78;stroke-width:3;marker-end:url(#r)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#7380a8"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#ff6b78"/></marker></defs>
<rect class="bg" width="1400" height="800" rx="28"/><text class="ttl" x="55" y="62">KV cache specialization: before and after</text><text class="sub" x="55" y="95">The model weights stay shared. Separate slots retain different stable prompt prefixes.</text>
<rect class="panel" x="50" y="145" width="610" height="550" rx="24"/><text class="mono" x="85" y="185">BEFORE · -c 4096 · -np 1</text>
<rect class="old" x="185" y="260" width="340" height="270" rx="22"/><text class="h" x="250" y="305">Single KV slot</text><text class="p" x="225" y="355">routing A replaces answer A</text><text class="p" x="225" y="395">answer A replaces routing A</text><text class="p" x="225" y="435">routing B replaces answer A</text><text class="p" x="225" y="475">stable prefixes repeatedly evaluated</text>
<path class="bad" d="M100 260C120 220 150 220 190 280"/><text class="p" x="80" y="230">route</text><path class="bad" d="M610 500C580 550 555 555 520 510"/><text class="p" x="565" y="580">answer</text>
<rect class="panel" x="740" y="145" width="610" height="550" rx="24"/><text class="mono" x="775" y="185">AFTER · -c 8192 · -np 2 · ONE ACTIVE GENERATION</text>
<rect class="route" x="800" y="250" width="220" height="300" rx="22"/><text class="h" x="855" y="295">Slot 0</text><text class="p" x="833" y="345">routing rules</text><text class="p" x="833" y="380">source catalog</text><text class="p" x="833" y="415">JSON schema</text><text class="p" x="833" y="470">4,096 tokens</text>
<rect class="answer" x="1070" y="250" width="220" height="300" rx="22"/><text class="h" x="1125" y="295">Slot 1</text><text class="p" x="1103" y="345">answer rules</text><text class="p" x="1103" y="380">ontology</text><text class="p" x="1103" y="415">source authority</text><text class="p" x="1103" y="470">4,096 tokens</text>
<path class="wire" d="M820 600H1000"/><text class="p" x="825" y="635">id_slot: 0 for routing</text><path class="wire" d="M1085 600H1265"/><text class="p" x="1080" y="635">id_slot: 1 for answers</text>
<text class="mono" x="85" y="750">MODEL WEIGHTS LOADED ONCE · KV CAPACITY DOUBLED · GATEWAY CONCURRENCY REMAINS 1</text>
</svg>
