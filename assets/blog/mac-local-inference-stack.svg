<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Mac-hosted nishad.ai inference stack</title>
<desc id="desc">The browser sends AI requests to a Cloudflare Worker. An authenticated tunnel reaches a Python gateway on the Mac, which queues requests and calls loopback llama.cpp with Qwen. WebLLM and WebGPU provide a browser fallback.</desc>
<defs><style>
.bg{fill:#0d0f1b}.zone{fill:#121528;stroke:#343754;stroke-width:2}.box{fill:#171d30;stroke:#9fffd2;stroke-width:2}.edge{fill:#18182c;stroke:#ff9bd6;stroke-width:2}.model{fill:#201a35;stroke:#b9a4ff;stroke-width:2}.fallback{fill:#241f25;stroke:#f4cf57;stroke-width:2}.ttl{fill:#f7f4ff;font:700 30px system-ui,sans-serif}.sub{fill:#aba8c8;font:18px system-ui,sans-serif}.h{fill:#f7f4ff;font:700 19px system-ui,sans-serif}.p{fill:#cfcbe5;font:16px system-ui,sans-serif}.mono{fill:#9fffd2;font:700 14px ui-monospace,monospace}.wire{fill:none;stroke:#7380a8;stroke-width:3;marker-end:url(#a)}.dash{fill:none;stroke:#f4cf57;stroke-width:3;stroke-dasharray:9 9;marker-end:url(#y)}
</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#7380a8"/></marker><marker id="y" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#f4cf57"/></marker></defs>
<rect class="bg" width="1400" height="820" rx="28"/>
<text class="ttl" x="55" y="62">nishad.ai — Mac-hosted local inference</text>
<text class="sub" x="55" y="95">Static website outside. Authenticated, loopback-only inference corridor inside.</text>
<rect class="zone" x="38" y="130" width="1324" height="510" rx="24"/>
<text class="mono" x="68" y="168">PRODUCTION PATH</text>
<path class="wire" d="M260 335H330"/><path class="wire" d="M540 335H610"/><path class="wire" d="M820 335H890"/><path class="wire" d="M1100 335H1170"/>
<rect class="box" x="60" y="235" width="200" height="200" rx="20"/>
<rect x="90" y="270" width="140" height="75" rx="9" fill="#0d0f1b" stroke="#9fffd2"/><text class="mono" x="106" y="315">guest@site:~$</text>
<text class="h" x="92" y="385">Browser</text><text class="p" x="92" y="413">Static terminal UI</text>
<rect class="edge" x="330" y="235" width="210" height="200" rx="20"/>
<path d="M397 293h76v64h-76z" fill="#0d0f1b" stroke="#ff9bd6" stroke-width="2"/><path d="M413 293v-16c0-31 44-31 44 0v16" fill="none" stroke="#ff9bd6" stroke-width="6"/>
<text class="h" x="372" y="385">Cloudflare</text><text class="p" x="369" y="413">Worker + tunnel</text>
<rect class="box" x="610" y="235" width="210" height="200" rx="20"/>
<path d="M658 282h114v72H658z" fill="#0d0f1b" stroke="#9fffd2" stroke-width="2"/><path d="M680 304h70M680 324h50" stroke="#9fffd2" stroke-width="5"/>
<text class="h" x="646" y="385">Python gateway</text><text class="p" x="652" y="413">Auth · queue · SSE</text>
<rect class="box" x="890" y="235" width="210" height="200" rx="20"/>
<g fill="none" stroke="#9fffd2" stroke-width="3"><circle cx="995" cy="316" r="44"/><path d="M951 316h88M995 272v88M964 285l62 62M1026 285l-62 62"/></g>
<text class="h" x="948" y="385">llama.cpp</text><text class="p" x="938" y="413">Metal inference</text>
<rect class="model" x="1170" y="235" width="165" height="200" rx="20"/>
<g fill="#b9a4ff"><circle cx="1214" cy="297" r="12"/><circle cx="1290" cy="297" r="12"/><circle cx="1252" cy="340" r="12"/><path d="M1214 297l38 43 38-43" stroke="#b9a4ff" stroke-width="5" fill="none"/></g>
<text class="h" x="1215" y="385">Qwen3-4B</text><text class="p" x="1216" y="413">Q4_K_M GGUF</text>
<text class="mono" x="640" y="486">MAC LOOPBACK BOUNDARY</text>
<rect class="fallback" x="330" y="525" width="770" height="90" rx="18"/>
<text class="h" x="365" y="565">Outage fallback: WebLLM + SmolLM2 inside a WebGPU-capable browser</text>
<text class="p" x="365" y="592">No Mac, tunnel, visitor key, or owner API account required</text>
<path class="dash" d="M160 435C170 570 250 570 320 570"/>
<text class="sub" x="60" y="700">Public:</text><text class="p" x="132" y="700">Worker URL only</text>
<text class="sub" x="355" y="700">Private:</text><text class="p" x="435" y="700">Tunnel origin + bearer token</text>
<text class="sub" x="780" y="700">Local:</text><text class="p" x="845" y="700">127.0.0.1:8094 → 127.0.0.1:8081</text>
<text class="mono" x="60" y="762">ONE ACTIVE GENERATION · TEN FIFO WAITERS · SIXTY-SECOND QUEUE LIMIT</text>
</svg>
