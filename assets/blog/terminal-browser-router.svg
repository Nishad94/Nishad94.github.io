<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760" role="img" aria-labelledby="title desc">
<title id="title">Browser shell routing flow</title><desc id="desc">Terminal text enters run. Known commands return deterministic browser responses. Unknown text enters askAI, which chooses Gemma by default, an explicitly enabled OpenAI session override, or WebGPU fallback.</desc>
<defs><style>.bg{fill:#0d0f1b}.box{fill:#17192d;stroke:#9fffd2;stroke-width:2}.decision{fill:#201a35;stroke:#b9a4ff;stroke-width:2}.alt{fill:#241f25;stroke:#f4cf57;stroke-width:2}.danger{fill:#25182a;stroke:#ff9bd6;stroke-width:2}.t{fill:#f7f4ff;font:700 29px system-ui,sans-serif}.s{fill:#aba8c8;font:17px system-ui,sans-serif}.h{fill:#f7f4ff;font:700 19px system-ui,sans-serif}.m{fill:#9fffd2;font:700 16px ui-monospace,monospace}.w{stroke:#7781a8;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke:#f4cf57;stroke-width:3;stroke-dasharray:8 8;fill:none;marker-end:url(#y)}.label{fill:#f4cf57;font:700 14px ui-monospace,monospace}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#7781a8"/></marker><marker id="y" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#f4cf57"/></marker></defs>
<rect class="bg" width="1300" height="760" rx="28"/><text class="t" x="55" y="62">The browser shell, without the wizard robe</text><text class="s" x="55" y="94">JavaScript classifies text. askAI() chooses a route. The model lives elsewhere.</text>
<path class="w" d="M245 200H360"/><path class="w" d="M570 200H690"/><path class="w" d="M465 280V370H310"/><path class="w" d="M900 200H1020"/><path class="w" d="M795 280V370H705"/><path class="w" d="M1115 280V370H1080"/><path class="d" d="M795 490V600H1040"/>
<rect class="box" x="55" y="140" width="190" height="120" rx="18"/><text class="m" x="87" y="180">INPUT</text><text class="h" x="87" y="215">Visitor presses</text><text class="h" x="87" y="240">Enter</text>
<rect class="decision" x="360" y="120" width="210" height="160" rx="24"/><text class="m" x="404" y="166">run(raw)</text><text class="h" x="391" y="205">Known shell</text><text class="h" x="414" y="232">command?</text>
<rect class="box" x="155" y="370" width="310" height="120" rx="18"/><text class="label" x="180" y="404">YES</text><text class="h" x="180" y="438">Answer in the browser</text><text class="s" x="180" y="467">help · pwd · git log · timeline</text>
<rect class="decision" x="690" y="120" width="210" height="160" rx="24"/><text class="m" x="747" y="166">askAI()</text><text class="h" x="724" y="205">Route traffic</text><text class="s" x="723" y="238">not generate text</text>
<text class="label" x="602" y="186">NO</text>
<rect class="box" x="1020" y="120" width="190" height="160" rx="20"/><text class="m" x="1057" y="166">DEFAULT</text><text class="h" x="1059" y="207">Gemma 4</text><text class="s" x="1053" y="238">self-hosted</text>
<rect class="alt" x="520" y="370" width="370" height="120" rx="18"/><text class="m" x="548" y="406">EXPLICIT OVERRIDE</text><text class="h" x="548" y="440">OpenAI with visitor key</text><text class="s" x="548" y="469">Current page session only</text>
<rect class="danger" x="930" y="370" width="300" height="120" rx="18"/><text class="m" x="958" y="406">REMOTE FAILED?</text><text class="h" x="958" y="440">Release busy state</text><text class="s" x="958" y="469">Continue down the route</text>
<rect class="alt" x="830" y="600" width="400" height="110" rx="18"/><text class="m" x="860" y="638">FINAL FALLBACK</text><text class="h" x="860" y="674">WebLLM on visitor WebGPU</text>
<text class="s" x="55" y="685">Nerd note: a remembered API key is inert until the visitor explicitly activates it.</text>
</svg>
