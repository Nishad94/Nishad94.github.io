<svg xmlns="http://www.w3.org/2000/svg" width="640" height="700" viewBox="0 0 640 700" role="img" aria-labelledby="title desc">
  <title id="title">Launching a small personal multiverse</title>
  <desc id="desc">Original editorial illustration of a neon rocket rising from a terminal browser, with an orbiting public-persona brain, Markdown notebook, and hosting cloud. The website combines a vanilla HTML, CSS and JavaScript shell, ontology.js for public facts, generated blog articles, and GitHub Pages hosting. Optional AI backends and private services remain separate. This is conceptual artwork, not a screenshot.</desc>
  <defs>
    <linearGradient id="night" x2="1" y2="1"><stop stop-color="#24203e"/><stop offset=".55" stop-color="#0d0f1b"/><stop offset="1" stop-color="#17243b"/></linearGradient>
    <radialGradient id="nebula"><stop stop-color="#b9a4ff" stop-opacity=".25"/><stop offset="1" stop-color="#b9a4ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x2=".8" y2="1"><stop stop-color="#383556"/><stop offset="1" stop-color="#101525"/></linearGradient>
    <linearGradient id="hull" x2="1" y2="1"><stop stop-color="#f7f4ff"/><stop offset=".5" stop-color="#b9a4ff"/><stop offset="1" stop-color="#665e9b"/></linearGradient>
    <linearGradient id="flame" y2="1" x2="0"><stop stop-color="#f7f4ff"/><stop offset=".3" stop-color="#9fffd2"/><stop offset="1" stop-color="#9fffd2" stop-opacity="0"/></linearGradient>
    <linearGradient id="ribbon"><stop stop-color="#9fffd2"/><stop offset="1" stop-color="#ff9bd6"/></linearGradient>
    <filter id="glow" x="-.8" y="-.8" width="2.6" height="2.6"><feGaussianBlur stdDeviation="7"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b9a4ff" stroke-opacity=".06"/></pattern>
  </defs>
