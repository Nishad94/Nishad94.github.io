<svg xmlns="http://www.w3.org/2000/svg" width="420" height="470" viewBox="0 0 420 470" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative daily browser counting, not production traffic</title>
  <desc id="desc">Synthetic example: day one has visits from browser A, B, A; day two has A, C, C. Each day has three pageviews and two daily unique browsers. The two-day totals are six pageviews and four browser-days, not four distinct people. Browser labels are explanatory only; the real tracker rotates daily identifiers and does not link days.</desc>
  <defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#343754" stroke-opacity=".3"/></pattern></defs>
  <rect width="420" height="470" rx="12" fill="#0d0f1b"/>
  <rect width="420" height="470" rx="12" fill="url(#grid)"/>
  <g font-family="ui-monospace,monospace">
    <text x="210" y="32" text-anchor="middle" fill="#b9a4ff" font-size="17">SYNTHETIC :: DAILY COUNTS</text>
    <rect x="50" y="57" width="14" height="14" fill="#9fffd2"/><text x="74" y="70" fill="#f7f4ff" font-size="16">Views</text>
    <rect x="182" y="57" width="14" height="14" fill="#b9a4ff"/><text x="206" y="70" fill="#f7f4ff" font-size="16">Daily browsers</text>
    <g stroke="#343754" fill="none"><path d="M54 112H382M54 168H382M54 224H382M54 280H382"/><path d="M54 96V280H382"/></g>
    <g fill="#aba8c8" font-size="16" text-anchor="end"><text x="44" y="118">3</text><text x="44" y="174">2</text><text x="44" y="230">1</text><text x="44" y="286">0</text></g>
    <g fill="#9fffd2"><rect x="100" y="112" width="36" height="168" rx="3"/><rect x="260" y="112" width="36" height="168" rx="3"/></g>
    <g fill="#b9a4ff"><rect x="144" y="168" width="36" height="112" rx="3"/><rect x="304" y="168" width="36" height="112" rx="3"/></g>
    <g text-anchor="middle" font-size="17" fill="#f7f4ff"><text x="140" y="308">Day 1</text><text x="300" y="308">Day 2</text></g>
    <g text-anchor="middle" font-size="16" fill="#aba8c8"><text x="140" y="334">A, B, A</text><text x="300" y="334">A, C, C</text></g>
    <path d="M24 356H396" stroke="#343754"/>
    <g text-anchor="middle" font-size="17">
      <text x="210" y="385" fill="#9fffd2">Total views = 3 + 3 = 6</text>
      <text x="210" y="415" fill="#b9a4ff">Browser-days = 2 + 2 = 4</text>
      <text x="210" y="447" fill="#ff9bd6">NOT distinct people across days</text>
    </g>
  </g>
</svg>
