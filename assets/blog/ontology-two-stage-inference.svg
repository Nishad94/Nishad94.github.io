<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
<title id="title">Ontology and two-stage inference pipeline</title><desc id="desc">Structured ontology and generated public articles form a validated source catalog. Qwen first selects evidence, then receives a grounded system prompt for final answer generation.</desc>
<defs><style>.bg{fill:#0d0f1b}.zone{fill:#121528;stroke:#343754;stroke-width:2}.data{fill:#171d30;stroke:#9fffd2;stroke-width:2}.route{fill:#241f25;stroke:#f4cf57;stroke-width:2}.answer{fill:#201a35;stroke:#b9a4ff;stroke-width:2}.edge{fill:#18182c;stroke:#ff9bd6;stroke-width:2}.ttl{fill:#f7f4ff;font:700 30px system-ui}.sub{fill:#aba8c8;font:18px system-ui}.h{fill:#f7f4ff;font:700 18px system-ui}.p{fill:#cfcbe5;font:15px system-ui}.mono{fill:#9fffd2;font:700 14px ui-monospace,monospace}.wire{fill:none;stroke:#7380a8;stroke-width:3;marker-end:url(#a)}.dash{fill:none;stroke:#f4cf57;stroke-width:3;stroke-dasharray:8 8;marker-end:url(#y)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#7380a8"/></marker><marker id="y" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#f4cf57"/></marker></defs>
<rect class="bg" width="1400" height="860" rx="28"/><text class="ttl" x="54" y="62">nishad.ai — ontology to grounded answer</text><text class="sub" x="54" y="95">Author facts once. Route evidence narrowly. Generate with an explicit authority hierarchy.</text>
<rect class="zone" x="38" y="130" width="1324" height="640" rx="24"/>
<rect class="data" x="70" y="190" width="250" height="220" rx="18"/><text class="mono" x="100" y="228">ONTOLOGY.JS</text><text class="h" x="100" y="270">Structured facts</text><text class="p" x="100" y="307">identity · career</text><text class="p" x="100" y="337">education · geography</text><text class="p" x="100" y="367">skills · projects · lore</text>
<rect class="data" x="70" y="480" width="250" height="180" rx="18"/><text class="mono" x="100" y="518">SITE-KNOWLEDGE.JSON</text><text class="h" x="100" y="560">Published passages</text><text class="p" x="100" y="597">blog posts · public pages</text><text class="p" x="100" y="627">drafts excluded</text>
<path class="wire" d="M320 300H405"/><path class="wire" d="M320 570H405"/>
<rect class="edge" x="405" y="280" width="240" height="270" rx="18"/><text class="mono" x="435" y="318">VALIDATED CATALOG</text><text class="h" x="435" y="360">Compact source rows</text><text class="p" x="435" y="400">id · title · description</text><text class="p" x="435" y="430">allow-listed URLs</text><text class="p" x="435" y="460">≤900-char passages</text><text class="p" x="435" y="490">strict source IDs</text>
<path class="wire" d="M645 415H730"/>
<rect class="route" x="730" y="220" width="255" height="230" rx="18"/><text class="mono" x="760" y="258">QWEN CALL 1 · SLOT 0</text><text class="h" x="760" y="300">Semantic routing</text><text class="p" x="760" y="340">temperature 0</text><text class="p" x="760" y="370">JSON schema</text><text class="p" x="760" y="400">one source or none</text>
<rect class="data" x="730" y="520" width="255" height="150" rx="18"/><text class="mono" x="760" y="558">SELECTED EVIDENCE</text><text class="h" x="760" y="600">Bounded passages</text><text class="p" x="760" y="635">up to 2,600 characters</text>
<path class="dash" d="M857 450V510"/>
<path class="wire" d="M985 595H1060"/>
<rect class="answer" x="1060" y="390" width="265" height="280" rx="18"/><text class="mono" x="1090" y="428">QWEN CALL 2 · SLOT 1</text><text class="h" x="1090" y="470">Grounded answer</text><text class="p" x="1090" y="510">ontology system prompt</text><text class="p" x="1090" y="540">selected evidence</text><text class="p" x="1090" y="570">tab conversation</text><text class="p" x="1090" y="600">streamed SSE output</text><text class="p" x="1090" y="630">validated source links</text>
<path class="wire" d="M985 335C1120 300 1190 310 1190 380"/><text class="p" x="1020" y="292">routing plan</text>
<text class="mono" x="70" y="730">TRUST ORDER: STRUCTURED ONTOLOGY → SELECTED PUBLIC EVIDENCE → GENERAL MODEL KNOWLEDGE</text>
</svg>
