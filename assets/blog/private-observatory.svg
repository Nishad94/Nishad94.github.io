    <rect width="252" height="158" rx="13" fill="url(#glass)" stroke="#b9a4ff"/>
    <path d="M0 30H252" stroke="#b9a4ff" stroke-opacity=".4"/>
    <text x="16" y="21" fill="#cfcae8" font-family="ui-monospace,monospace" font-size="17">PRIVATE / REPORTS</text>
    <g fill="#9fffd2" fill-opacity=".7"><rect x="19" y="48" width="62" height="22" rx="5"/><rect x="95" y="48" width="62" height="22" rx="5"/><rect x="171" y="48" width="62" height="22" rx="5"/></g>
    <path d="M20 91H230M20 111H230M20 135H230" stroke="#b9a4ff" stroke-opacity=".15"/>
    <g fill="#b9a4ff"><rect x="26" y="111" width="21" height="24" rx="3"/><rect x="64" y="100" width="21" height="35" rx="3"/><rect x="102" y="91" width="21" height="44" rx="3"/></g>
    <g fill="#ff9bd6"><rect x="160" y="101" width="69" height="5" rx="2"/><rect x="160" y="115" width="45" height="5" rx="2"/><rect x="160" y="129" width="55" height="5" rx="2"/></g>
  </g>
  <text x="443" y="495" text-anchor="middle" font-family="ui-monospace,monospace" fill="#f7f4ff" font-size="23">Owner-only session</text>
  <path d="M215 550C285 610 362 562 394 510" fill="none" stroke="#ff9bd6" stroke-width="2"/>
  <text x="353" y="607" font-family="ui-monospace,monospace" fill="#ff9bd6" font-size="21">Read aggregates</text>
  <g transform="translate(38 491)">
    <path d="M0 24v111c0 31 181 31 181 0V24Z" fill="url(#metal)" stroke="#b9a4ff" stroke-width="2"/>
    <ellipse cx="90.5" cy="24" rx="90.5" ry="24" fill="#404565" stroke="#b9a4ff" stroke-width="2"/>
    <ellipse cx="90.5" cy="24" rx="70" ry="14" fill="#b9a4ff" fill-opacity=".08"/>
    <path d="M0 61c0 31 181 31 181 0M0 98c0 31 181 31 181 0" fill="none" stroke="#b9a4ff" stroke-opacity=".6"/>
    <g fill="#9fffd2"><circle cx="23" cy="56" r="4"/><circle cx="23" cy="93" r="4"/><circle cx="23" cy="130" r="4"/></g>
  </g>
  <g transform="translate(535 560)">
    <circle r="36" fill="#17192d" stroke="#9fffd2" stroke-opacity=".6"/>
    <path d="M0-26a26 26 0 1 1-25 19m-5-1 5 7 7-5" fill="none" stroke="#9fffd2" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-family="ui-monospace,monospace" fill="#f7f4ff" font-size="19">24h</text>
  </g>
  <text x="128" y="671" text-anchor="middle" font-family="ui-monospace,monospace" fill="#cfcae8" font-size="23">PostgreSQL</text>
  <path d="M32 691H608" stroke="url(#edge)" stroke-opacity=".5"/>
  <text x="320" y="719" text-anchor="middle" font-family="ui-monospace,monospace" fill="#aba8c8" font-size="19">Concept art / decorative bars, not live data</text>
</svg>
