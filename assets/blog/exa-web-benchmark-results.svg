<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
<title id="title">Web enrichment latency benchmark</title><desc id="desc">A latency chart compares local Qwen generation, Exa search, Qwen web synthesis and combined end-to-end time across ten prompts, showing Exa search is the smallest phase.</desc>
<defs><style>.bg{fill:#0d0f1b}.panel{fill:#121528;stroke:#343754;stroke-width:2}.local{fill:#55a9ff}.exa{fill:#4ee38c}.synth{fill:#b690ff}.total{fill:#ff9bd6}.ttl{fill:#f7f4ff;font:700 30px system-ui}.sub{fill:#aba8c8;font:18px system-ui}.h{fill:#f7f4ff;font:700 18px system-ui}.p{fill:#cfcbe5;font:15px system-ui}.mono{fill:#9fffd2;font:700 14px ui-monospace,monospace}.axis{stroke:#7380a8;stroke-width:2}</style></defs>
<rect class="bg" width="1400" height="800" rx="28"/><text class="ttl" x="55" y="62">Exa web enrichment benchmark · 10 prompts</text><text class="sub" x="55" y="95">Median and p95 phase latency. Search runs in parallel with the local answer.</text>
<rect class="panel" x="55" y="145" width="1290" height="555" rx="24"/><path class="axis" d="M300 625H1270"/>
<text class="h" x="90" y="230">Local Qwen answer</text><rect class="local" x="300" y="195" width="210" height="42" rx="8"/><text class="p" x="525" y="222">p50 7.80 s</text><rect class="local" x="300" y="245" width="645" height="20" rx="6" opacity=".55"/><text class="p" x="960" y="262">p95 23.93 s</text>
<text class="h" x="90" y="350">Exa Lite search</text><rect class="exa" x="300" y="315" width="50" height="42" rx="8"/><text class="p" x="365" y="342">p50 1.87 s</text><rect class="exa" x="300" y="365" width="82" height="20" rx="6" opacity=".55"/><text class="p" x="397" y="382">p95 3.02 s</text>
<text class="h" x="90" y="470">Qwen web synthesis</text><rect class="synth" x="300" y="435" width="447" height="42" rx="8"/><text class="p" x="762" y="462">p50 16.58 s</text><rect class="synth" x="300" y="485" width="976" height="20" rx="6" opacity=".55"/><text class="p" x="1090" y="502">p95 36.20 s</text>
<text class="h" x="90" y="590">Combined end to end</text><rect class="total" x="300" y="555" width="495" height="42" rx="8"/><text class="p" x="810" y="582">p50 36.64 s</text>
<rect x="90" y="645" width="1180" height="85" rx="15" fill="#171d30" stroke="#9fffd2" stroke-width="2"/><text class="mono" x="120" y="680">SEARCH WAS FULLY HIDDEN BY LOCAL GENERATION IN ALL 10 SCENARIOS</text><text class="p" x="120" y="710">Optimization target: routing and second Qwen synthesis, not Exa latency.</text>
</svg>
