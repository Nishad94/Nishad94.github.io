<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
<title id="title">Exa search security boundary</title><desc id="desc">The browser sends one bounded query to the Cloudflare Worker. The Worker injects the Exa secret, calls only the Exa endpoint, validates HTTPS results, and returns sanitized snippets. The browser and Mac never receive the key.</desc>
<defs><style>.bg{fill:#0d0f1b}.zone{fill:#121528;stroke:#343754;stroke-width:2}.browser{fill:#171d30;stroke:#9fffd2;stroke-width:2}.worker{fill:#18182c;stroke:#ff9bd6;stroke-width:2}.provider{fill:#241f25;stroke:#f1c75b;stroke-width:2}.deny{fill:#251820;stroke:#ff6b78;stroke-width:2}.ttl{fill:#f7f4ff;font:700 30px system-ui}.sub{fill:#aba8c8;font:18px system-ui}.h{fill:#f7f4ff;font:700 18px system-ui}.p{fill:#cfcbe5;font:15px system-ui}.mono{fill:#9fffd2;font:700 14px ui-monospace,monospace}.wire{fill:none;stroke:#7380a8;stroke-width:3;marker-end:url(#a)}.secret{fill:none;stroke:#f1c75b;stroke-width:3;stroke-dasharray:8 8;marker-end:url(#y)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#7380a8"/></marker><marker id="y" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#f1c75b"/></marker></defs>
<rect class="bg" width="1400" height="780" rx="28"/><text class="ttl" x="55" y="62">Search authority stays at the edge</text><text class="sub" x="55" y="95">Qwen proposes a query. The Worker controls credentials, provider access, validation and quotas.</text>
<rect class="zone" x="45" y="140" width="1310" height="555" rx="24"/>
<rect class="browser" x="80" y="230" width="245" height="230" rx="18"/><text class="mono" x="110" y="268">BROWSER</text><text class="h" x="110" y="310">Bounded query</text><text class="p" x="110" y="350">no Exa key</text><text class="p" x="110" y="380">no gateway token</text><text class="p" x="110" y="410">no cookies forwarded</text>
<path class="wire" d="M325 345H430"/>
<rect class="worker" x="430" y="190" width="340" height="330" rx="18"/><text class="mono" x="460" y="228">CLOUDFLARE WORKER /SEARCH</text><text class="h" x="460" y="270">Policy boundary</text><text class="p" x="460" y="310">origin + body validation</text><text class="p" x="460" y="340">20 visitor / 500 global daily</text><text class="p" x="460" y="370">10-second timeout</text><text class="p" x="460" y="400">HTTPS URL sanitation</text><text class="p" x="460" y="430">title/snippet bounds</text><text class="p" x="460" y="460">provider errors sanitized</text>
<path class="wire" d="M770 345H875"/>
<rect class="provider" x="875" y="230" width="220" height="230" rx="18"/><text class="mono" x="905" y="268">EXA LITE</text><text class="h" x="905" y="310">Cached highlights</text><text class="p" x="905" y="350">maximum 5 results</text><text class="p" x="905" y="380">moderation enabled</text><text class="p" x="905" y="410">no live crawling</text>
<rect class="provider" x="520" y="565" width="180" height="85" rx="14"/><text class="mono" x="548" y="600">SECRET STORE</text><text class="p" x="548" y="628">EXA_API_KEY</text><path class="secret" d="M610 565V520"/>
<rect class="deny" x="1140" y="215" width="170" height="270" rx="18"/><text class="mono" x="1170" y="255">NEVER FETCH</text><text class="p" x="1170" y="300">localhost</text><text class="p" x="1170" y="335">private IPs</text><text class="p" x="1170" y="370">file URLs</text><text class="p" x="1170" y="405">result pages</text><text class="p" x="1170" y="440">credentials</text>
<text class="mono" x="80" y="660">PUBLIC OUTPUT: TITLE · HTTPS URL · ≤900-CHAR SNIPPET · OPTIONAL PUBLICATION DATE</text>
</svg>
