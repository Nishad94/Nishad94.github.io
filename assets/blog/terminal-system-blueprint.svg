<rect class="alt" x="70" y="520" width="430" height="125" rx="18"/><text class="mono yellow" x="98" y="558">EXPLICIT SESSION OVERRIDE</text><text class="h" x="98" y="591">OpenAI BYOK</text><text class="p" x="98" y="620">Only after MULTIVERSE or key</text>
<rect class="alt" x="830" y="520" width="502" height="125" rx="18"/><text class="mono yellow" x="858" y="558">OUTAGE FALLBACK</text><text class="h" x="858" y="591">WebLLM + WebGPU</text><text class="p" x="858" y="620">SmolLM2 runs inside the visitor’s browser</text>
