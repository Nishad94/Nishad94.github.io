<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
<title id="title">nishad.ai Terminal system blueprint</title>
<desc id="desc">The static browser shell handles deterministic commands locally. AI questions travel over HTTPS through Caddy and a validating Python gateway to loopback llama.cpp and Gemma. OpenAI is an explicit session override and WebGPU is the outage fallback.</desc>
<defs><style>
.bg{fill:#0d0f1b}.zone{fill:#121528;stroke:#343754;stroke-width:2}.edge{fill:#18182c;stroke:#ff9bd6;stroke-width:2}.svc{fill:#171d30;stroke:#9fffd2;stroke-width:2}.model{fill:#201a35;stroke:#b9a4ff;stroke-width:2}.alt{fill:#241f25;stroke:#f4cf57;stroke-width:2}.ttl{fill:#f7f4ff;font:700 29px system-ui,sans-serif}.sub{fill:#aba8c8;font:18px system-ui,sans-serif}.h{fill:#f7f4ff;font:700 19px system-ui,sans-serif}.p{fill:#cfcbe5;font:16px system-ui,sans-serif}.mono{fill:#9fffd2;font:700 15px ui-monospace,monospace}.pink{fill:#ff9bd6}.yellow{fill:#f4cf57}.wire{fill:none;stroke:#7380a8;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#f4cf57;stroke-width:3;stroke-dasharray:9 9;marker-end:url(#arrowY)}
</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#7380a8"/></marker><marker id="arrowY" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#f4cf57"/></marker></defs>
<rect class="bg" width="1400" height="860" rx="28"/>
<text class="ttl" x="58" y="62">nishad.ai Terminal — system blueprint</text><text class="sub" x="58" y="94">Static shell outside. Narrow inference corridor inside. No mystery backend soup.</text>
<rect class="zone" x="40" y="125" width="1320" height="575" rx="24"/>
<text class="mono" x="68" y="164">PRODUCTION REQUEST PATH</text>
<path class="wire" d="M300 335H365"/><path class="wire" d="M585 335H650"/><path class="wire" d="M870 335H935"/><path class="wire" d="M1155 335H1212"/>
<rect class="svc" x="70" y="225" width="230" height="220" rx="20"/>
<rect x="105" y="260" width="160" height="92" rx="10" fill="#0d0f1b" stroke="#9fffd2"/><circle cx="125" cy="279" r="5" fill="#ff9bd6"/><circle cx="142" cy="279" r="5" fill="#f4cf57"/><circle cx="159" cy="279" r="5" fill="#9fffd2"/><text class="mono" x="120" y="316">guest@site:~$</text><text class="h" x="98" y="390">Browser shell</text><text class="p" x="98" y="418">run() + askAI()</text>
<rect class="edge" x="365" y="225" width="220" height="220" rx="20"/><path d="M433 292h84v72h-84z" fill="#0d0f1b" stroke="#ff9bd6" stroke-width="2"/><path d="M449 292v-18c0-35 52-35 52 0v18" fill="none" stroke="#ff9bd6" stroke-width="6"/><text class="h" x="424" y="390">Caddy</text><text class="p" x="408" y="418">TLS front door</text>
<rect class="svc" x="650" y="225" width="220" height="220" rx="20"/><path d="M710 282h100v65H710z" fill="#0d0f1b" stroke="#9fffd2" stroke-width="2"/><path d="M730 303h60M730 322h43" stroke="#9fffd2" stroke-width="5"/><text class="h" x="690" y="390">Python gateway</text><text class="p" x="688" y="418">Policy + SSE</text>
<rect class="svc" x="935" y="225" width="220" height="220" rx="20"/><g fill="none" stroke="#9fffd2" stroke-width="3"><circle cx="1045" cy="310" r="44"/><path d="M1001 310h88M1045 266v88M1014 279l62 62M1076 279l-62 62"/></g><text class="h" x="990" y="390">llama.cpp</text><text class="p" x="978" y="418">CPU inference engine</text>
