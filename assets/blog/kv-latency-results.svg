<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Cold versus warm KV cache latency results</title><desc id="desc">Bar charts compare p50 routing and answer time to first token and total latency before and after warming dedicated KV-cache slots.</desc>
<defs><style>.bg{fill:#0d0f1b}.panel{fill:#121528;stroke:#343754;stroke-width:2}.cold{fill:#ff9bd6}.warm{fill:#4ee38c}.ttl{fill:#f7f4ff;font:700 30px system-ui}.sub{fill:#aba8c8;font:18px system-ui}.h{fill:#f7f4ff;font:700 18px system-ui}.p{fill:#cfcbe5;font:15px system-ui}.mono{fill:#9fffd2;font:700 14px ui-monospace,monospace}.axis{stroke:#7380a8;stroke-width:2}</style></defs>
<rect class="bg" width="1400" height="760" rx="28"/><text class="ttl" x="55" y="62">Two-slot KV benchmark · median across 10 scenarios</text><text class="sub" x="55" y="95">Cold first request versus median of identical requests two and three.</text>
<rect class="panel" x="55" y="145" width="620" height="500" rx="22"/><text class="h" x="90" y="190">Time to first token</text><path class="axis" d="M180 550H620"/>
<text class="p" x="85" y="285">Routing</text><rect class="cold" x="180" y="235" width="365" height="36" rx="8"/><text class="p" x="555" y="260">6.77 s</text><rect class="warm" x="180" y="278" width="8" height="36" rx="4"/><text class="p" x="200" y="303">0.13 s · 98.1% faster</text>
<text class="p" x="85" y="425">Answer</text><rect class="cold" x="180" y="375" width="125" height="36" rx="8"/><text class="p" x="317" y="400">2.32 s</text><rect class="warm" x="180" y="418" width="5" height="36" rx="3"/><text class="p" x="200" y="443">0.08 s · 96.4% faster</text>
<rect class="panel" x="725" y="145" width="620" height="500" rx="22"/><text class="h" x="760" y="190">Total response latency</text><path class="axis" d="M850 550H1290"/>
<text class="p" x="755" y="285">Routing</text><rect class="cold" x="850" y="235" width="390" height="36" rx="8"/><text class="p" x="1250" y="260">9.98 s</text><rect class="warm" x="850" y="278" width="91" height="36" rx="8"/><text class="p" x="955" y="303">2.34 s · 76.5% faster</text>
<text class="p" x="755" y="425">Answer</text><rect class="cold" x="850" y="375" width="231" height="36" rx="8"/><text class="p" x="1093" y="400">5.92 s</text><rect class="warm" x="850" y="418" width="127" height="36" rx="8"/><text class="p" x="990" y="443">3.25 s · 45.0% faster</text>
<rect x="90" y="600" width="1220" height="90" rx="16" fill="#171d30" stroke="#9fffd2" stroke-width="2"/><text class="mono" x="120" y="638">CACHE EFFECT: PROMPT PREFILL DROPS SHARPLY · OUTPUT DECODING STILL RUNS TOKEN BY TOKEN</text><text class="p" x="120" y="670">Exact repeated prompts are an upper bound; real questions reuse only the stable prefix.</text>
</svg>
