<svg xmlns="http://www.w3.org/2000/svg" width="420" height="690" viewBox="0 0 420 690" role="img" aria-labelledby="title desc">
  <title id="title">The static site publishing pipeline</title>
  <desc id="desc">Homepage and public modules plus Markdown posts enter the Node builder. It validates metadata and drafts, renders articles, and copies approved files into the site artifact. GitHub Actions tests and publishes that artifact to GitHub Pages and nishad.ai. Private services and secrets never enter the artifact.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#343754" stroke-opacity=".3"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m0 0 6 4-6 4" fill="none" stroke="#9fffd2" stroke-width="1.5"/></marker>
  </defs>
  <rect width="420" height="690" rx="12" fill="#0d0f1b"/>
  <rect width="420" height="690" rx="12" fill="url(#grid)"/>
  <g font-family="ui-monospace,monospace" text-anchor="middle">
    <text x="210" y="34" fill="#b9a4ff" font-size="17">BUILD :: STATIC PUBLIC OUTPUT</text>
    <g fill="#17192d" stroke="#343754">
      <rect x="28" y="58" width="364" height="104" rx="10"/>
      <rect x="28" y="198" width="364" height="104" rx="10"/>
      <rect x="28" y="338" width="364" height="90" rx="10"/>
      <rect x="28" y="464" width="364" height="76" rx="10"/>
      <rect x="28" y="576" width="364" height="66" rx="10" stroke="#9fffd2"/>
    </g>
    <g fill="#f7f4ff" font-size="19">
      <text x="210" y="86">index.html + public modules</text>
      <text x="210" y="115">ontology.js + assets/</text>
      <text x="210" y="144">posts/*.md</text>
      <text x="210" y="226">Node build-site.mjs</text>
      <text x="210" y="366">_site/ public artifact</text>
      <text x="210" y="492">GitHub Actions on master</text>
      <text x="210" y="603">GitHub Pages</text>
    </g>
    <g fill="#aba8c8" font-size="16">
      <text x="210" y="255">Validate metadata + drafts</text>
      <text x="210" y="284">Render blog; copy homepage</text>
      <text x="210" y="396">HTML / assets / sitemap</text>
      <text x="210" y="520">Locked install, checks, deploy</text>
      <text x="210" y="628">nishad.ai / HTTPS</text>
    </g>
    <text x="210" y="672" fill="#ff9bd6" font-size="16">NO private backend or secrets</text>
  </g>
  <g fill="none" stroke="#9fffd2" stroke-width="2" marker-end="url(#arrow)">
    <path d="M210 162V190"/><path d="M210 302V330"/><path d="M210 428V456"/><path d="M210 540V568"/>
  </g>
</svg>
