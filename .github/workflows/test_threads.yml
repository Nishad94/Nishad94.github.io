name: Publish test post to Threads

on:
  workflow_dispatch:
    inputs:
      post_text:
        description: Text to publish
        required: true
        default: Hello World 👽
        type: string
      publish:
        description: Publish to Threads (leave disabled for a dry run)
        required: true
        default: false
        type: boolean
      image_url:
        description: Optional public HTTPS image URL
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: threads-test-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Validate publisher
        run: python -m py_compile test_threads_post.py
      - name: Run Threads publisher
        env:
          POST_TEXT: ${{ inputs.post_text }}
          PUBLISH: ${{ inputs.publish }}
          IMAGE_URL: ${{ inputs.image_url }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          args=(--text "$POST_TEXT")
          if [[ -n "$IMAGE_URL" ]]; then
            args+=(--image-url "$IMAGE_URL")
          fi
          if [[ "$PUBLISH" != "true" ]]; then
            args+=(--dry-run)
          fi
          python test_threads_post.py "${args[@]}"
