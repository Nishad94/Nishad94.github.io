<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://accounts.spotify.com; img-src data:; base-uri 'none'; form-action 'none'">
<link rel="icon" href="data:,">
<title>Returning to nishad.ai</title>
<style>
body{max-width:680px;margin:12vh auto;padding:24px;background:#0d0f1b;color:#f7f4ff;font:16px/1.7 ui-monospace,monospace}a{color:#9fffd2}#status{overflow-wrap:anywhere}
</style>
</head>
<body>
<h1>Spotify connection</h1>
<p id="status" role="status">Completing sign-in in this tab...</p>
<p><a href="/#music">Return to music vibes</a></p>
<noscript>JavaScript is required. Do not share this callback URL; return to the terminal and try again with JavaScript enabled.</noscript>
<script>
(async () => {
  const params = new URLSearchParams(location.search);
  // Scrub credentials before loading even a same-origin module.
  history.replaceState(null, '', '/spotify-callback.html');
  const status = document.getElementById('status');
  let spotify;
  try {
    spotify = await import('./spotify.js');
    const range = await spotify.finishSpotifyLogin(params);
    location.replace('/#music-vibe-' + range);
  } catch (error) {
    status.textContent = spotify && error instanceof spotify.SpotifyError
      ? error.message
      : 'Spotify sign-in could not finish. Return to music vibes and choose Connect Spotify.';
  }
})();
</script>
</body>
</html>
